<!doctype html>
<!--
  A stand-in for a heavy project in Live: a WebGL2 scene that issues thousands of small draw calls
  every frame and shades the whole view with an expensive pass, as a three.js stadium with its
  crowd, lights and post-processing does, so the GPU stays as busy as it does beside a real chat.
  `?draws=N` sets the draw calls per frame, `?fill=N` the shading loop per pixel (0: none).
  window.gpuLoad reports frames.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05070d;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas></canvas>
    <script>
      const params = new URLSearchParams(location.search.slice(1));
      const DRAWS = Number(params.get("draws") ?? 8000);
      const FILL = Number(params.get("fill") ?? 0);
      const canvas = document.querySelector("canvas");
      const gl = canvas.getContext("webgl2", { antialias: true });
      const shader = (type, source) => {
        const s = gl.createShader(type);
        gl.shaderSource(s, source);
        gl.compileShader(s);
        return s;
      };
      const program = gl.createProgram();
      gl.attachShader(
        program,
        shader(
          gl.VERTEX_SHADER,
          `#version 300 es
          in vec2 p; uniform vec4 at;
          void main() { gl_Position = vec4(at.xy + p * at.z, 0.0, 1.0); }`,
        ),
      );
      gl.attachShader(
        program,
        shader(
          gl.FRAGMENT_SHADER,
          `#version 300 es
          precision highp float; uniform vec4 at; uniform int fill; out vec4 color;
          void main() {
            vec3 c = vec3(0.2 + 0.6 * fract(at.w), 0.3, 0.5 + 0.4 * fract(at.w * 7.0));
            vec2 q = gl_FragCoord.xy * 0.003;
            for (int i = 0; i < fill; i++) q = vec2(sin(q.y * 1.7 + at.w), cos(q.x * 1.3 - float(i)));
            color = vec4(c + 0.001 * q.xyx, 1.0);
          }`,
        ),
      );
      gl.linkProgram(program);
      gl.useProgram(program);
      const buffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, 0, 1]), gl.STATIC_DRAW);
      const p = gl.getAttribLocation(program, "p");
      gl.enableVertexAttribArray(p);
      gl.vertexAttribPointer(p, 2, gl.FLOAT, false, 0, 0);
      const at = gl.getUniformLocation(program, "at");
      const fill = gl.getUniformLocation(program, "fill");
      window.gpuLoad = { frames: 0, draws: DRAWS, fill: FILL };
      const frame = (time) => {
        const width = Math.round(canvas.clientWidth * devicePixelRatio);
        const height = Math.round(canvas.clientHeight * devicePixelRatio);
        if (canvas.width !== width || canvas.height !== height) {
          canvas.width = width;
          canvas.height = height;
        }
        gl.viewport(0, 0, width, height);
        gl.clearColor(0.02, 0.03, 0.05, 1);
        gl.clear(gl.COLOR_BUFFER_BIT);
        // The expensive pass: one triangle covering the view, shaded FILL times per pixel.
        gl.uniform1i(fill, FILL);
        gl.uniform4f(at, 0, 0, 3, 0.5);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        gl.uniform1i(fill, 0);
        for (let i = 0; i < DRAWS; i++) {
          const a = i * 0.618 + time * 0.0003;
          gl.uniform4f(at, Math.sin(a * 3.1) * 0.95, Math.cos(a * 1.7) * 0.95, 0.02, i * 0.013);
          gl.drawArrays(gl.TRIANGLES, 0, 3);
        }
        window.gpuLoad.frames++;
        requestAnimationFrame(frame);
      };
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
